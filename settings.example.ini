; Example settings for this fork (League of Legends via WeGame).
; Copy to %APPDATA%\NoFocusSteal\settings.ini
; Edit only after quitting NoFocusSteal, otherwise the running app may overwrite the file.

mode=Strict
typingWindowMs=1500
intentWindowMs=1500
launchGraceMs=20000
notify=false
trustInjectedInput=false

allow:explorer.exe=1
allow:gameviewer.exe=1
allow:grok bot.exe=1
allow:telegram.exe=1
allow:wegame.exe=1
block:leagueclient.exe=1
block:leagueclientux.exe=1
block:leagueclientuxrender.exe=1
block:pallas.exe=1
block:riotclientservices.exe=1
block:riotclientux.exe=1

; "League of Legends.exe" is intentionally neither allowed nor blocked.
; Strict mode still stops an unsolicited game window at match start;
; clicking the game or using Alt+Tab still lets you in.
